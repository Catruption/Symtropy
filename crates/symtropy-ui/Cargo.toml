[package]
name = "symtropy-ui"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Enables the local-only image feature suggester. No model files are fetched.
local-vision = ["dep:symtropy-vision"]
# Enables explicit-path ONNX inference. No models or runtime binaries are fetched.
onnx-vision = ["local-vision", "symtropy-vision/onnx"]

[dependencies]
webp = "0.3"
eframe = { workspace = true }
egui = { workspace = true }
image = { workspace = true }
webp-animation = { workspace = true }
alhazen-core = { workspace = true }
wayland-client = { version = "0.31", features = ["system"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
rayon = { workspace = true }
rusqlite = { workspace = true }
dirs = { workspace = true }
open = { workspace = true }
trash = { workspace = true }
sysinfo = { workspace = true }
urlencoding = "2.1"
ssvg = { path = "../ssvg" }
symtropy-tags = { path = "../symtropy-tags" }
symtropy-sources = { path = "../symtropy-sources" }
symtropy-vision = { path = "../symtropy-vision", optional = true }

[[example]]
name = "convert"
path = "examples/convert.rs"

[[example]]
name = "migrate_sidecars"
path = "examples/migrate_sidecars.rs"

[[example]]
name = "rescue_digikam"
path = "examples/rescue_digikam.rs"

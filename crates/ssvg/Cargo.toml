[package]
name = "ssvg"
version = "0.1.0"
edition = "2021"
description = "SuperSVG composite image format"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
json5 = "1"
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webp = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

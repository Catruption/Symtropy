[package]
name = "symtropy-agent"
version = "0.1.0"
edition = "2021"
description = "Local proposal-only agent bridge for the Symtropy tag system"

[dependencies]
dirs = { workspace = true }
json5 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symtropy-tags = { path = "../symtropy-tags" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "symtropy-agent"
path = "src/main.rs"

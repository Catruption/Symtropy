[workspace]
members = ["crates/symtropy-ui"]
resolver = "2"

[workspace.dependencies]
eframe = "0.27"
egui = "0.27"
image = { version = "0.25", features = ["webp", "jpeg", "png", "gif"] }
webp-animation = "0.9"
alhazen-core = "0.5"
x11rb = "0.13"
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5.0"
open = "5.0"
trash = "5.1"
sysinfo = "0.30"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3